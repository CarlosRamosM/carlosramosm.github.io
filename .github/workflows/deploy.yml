name: Deploy Astro site to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      # 1. Forzamos Node 22 de manera explícita (las comillas evitan problemas de parseo de YAML)
      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      
      # 2. Instalación limpia y determinista (npm ci es más rápido y seguro que npm install en CI)
      - name: Install dependencies
        run: npm ci
      
      # 3. Ejecutamos el build directamente, sin acciones de terceros que puedan interferir
      - name: Build with Astro
        run: npm run build

      # 4. Subimos la carpeta 'dist' generada como artefacto para el paso de deploy
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4